name: Build ISOs

on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - live
  #   paths:
  #     - './.github/workflows/config/iso.toml'
  #     - './.github/workflows/config/image.toml'
  #     - './.github/workflows/iso-hardened '

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISOs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false      
      matrix:
        image:
          - silverblue-main-hardened
          - silverblue-nvidia-hardened 
          - silverblue-nvidia-open-hardened 
          - kinoite-main-hardened 
          - kinoite-nvidia-hardened 
          - kinoite-nvidia-open-hardened 
          - sericea-main-hardened 
          - sericea-nvidia-hardened 
          - sericea-nvidia-open-hardened 
          - cosmic-main-hardened 
          - cosmic-nvidia-hardened 
          - cosmic-nvidia-open-hardened 
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Install deps
        shell: bash
        id: install_deps
        run: |
          sudo apt-get install rclone

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set target image
        shell: bash
        run: sed -i 's/TARGETIMAGE/${{ matrix.image }}/g' ./.github/workflows/config/iso.toml

      - name: Pull image
        shell: bash
        run: sudo podman pull "ghcr.io/secureblue/${{ matrix.image }}:latest"

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: iso_build
        env:
          IMAGE_NAME: ${{ matrix.image }}
        with:
          arch: x86_64
          image_name: ${{ env.IMAGE_NAME}}
          image_repo: ghcr.io/secureblue
          image_tag: latest
          version: 42
          variant: silverblue
          iso_name: ${{ env.IMAGE_NAME }}.iso


      - name: Rename ISO and sign CHECKSUM
        id: rename
        shell: bash
        env:
          OUTPUT_DIRECTORY: ${{ steps.iso_build.outputs.iso_path }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          sudo chown $(whoami) "${IMAGE_NAME}.iso" "${IMAGE_NAME}.iso-CHECKSUM"

          HASH=$(cat "${IMAGE_NAME}.iso-CHECKSUM" | cut -d ' ' -f1)
          ISO_SIZE=$(stat -c %s "${IMAGE_NAME}.iso")
          ISO_FILE_NAME="${IMAGE_NAME}.iso"
          {
            echo "# $ISO_FILE_NAME: $ISO_SIZE bytes"
            echo "SHA256 ($ISO_FILE_NAME) = $HASH"
          } > "${IMAGE_NAME}.iso-CHECKSUM"

          echo "CHECKSUM contents"
          cat "${IMAGE_NAME}.iso-CHECKSUM"
          echo

          echo "${{ secrets.ISO_SIGNING_KEY }}" | gpg --import

          echo "Signing the ISO"
          gpg --clearsign -u 26B4463ED8F313BC7E3FBDF9D9223AF0F47B3E41 "${IMAGE_NAME}.iso-CHECKSUM"
          mv "${IMAGE_NAME}.iso-CHECKSUM.asc" "${IMAGE_NAME}.iso-CHECKSUM"

          echo "Signed CHECKSUM contents"
          cat "${IMAGE_NAME}.iso-CHECKSUM"
          echo

          # validate signature
          curl -O "https://repo.secureblue.dev/secureblue.gpg"
          gpg --no-default-keyring --keyring ./secureblue-keyring.gpg --import secureblue.gpg

          if ! gpgv --keyring ./secureblue-keyring.gpg "${IMAGE_NAME}.iso-CHECKSUM"; then
              echo "CHECKSUM signature verification FAILED! Exiting..."
              exit 1
          fi

          if ! sha256sum --ignore-missing -c "${IMAGE_NAME}.iso-CHECKSUM"; then
              echo "CHECKSUM verification FAILED! Exiting..."
              exit 1
          fi

          rm ./secureblue-keyring.gpg~
          rm secureblue.gpg

          echo "output-directory=${OUTPUT_DIRECTORY}" >> ${GITHUB_OUTPUT}

      - name: Upload ISO and Checksum to Job Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ${{ steps.rename.outputs.iso_path }}
          name: ${{ matrix.image }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true

      - name: Upload ISO and checksum to R2 to ISOS Bucket
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.ISOS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.ISOS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.ISOS_ENDPOINT }}
          SOURCE_DIR: .
        run: |
          rclone copy "${{ steps.rename.outputs.output-directory }}" R2:isos 
      
