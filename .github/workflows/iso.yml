name: Build ISOs

on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - live
  #   paths:
  #     - './.github/workflows/config/iso.toml'
  #     - './.github/workflows/config/image.toml'
  #     - './.github/workflows/iso-hardened '

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISOs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false      
      matrix:
        image:
          - silverblue-main-hardened
          - silverblue-nvidia-hardened 
          - silverblue-nvidia-open-hardened 
          - kinoite-main-hardened 
          - kinoite-nvidia-hardened 
          - kinoite-nvidia-open-hardened 
          - sericea-main-hardened 
          - sericea-nvidia-hardened 
          - sericea-nvidia-open-hardened 
          - cosmic-main-hardened 
          - cosmic-nvidia-hardened 
          - cosmic-nvidia-open-hardened 
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Install deps
        shell: bash
        id: install_deps
        run: |
          sudo apt-get install rclone

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set target image
        shell: bash
        run: sed -i 's/TARGETIMAGE/${{ matrix.image }}/g' ./.github/workflows/config/iso.toml

      - name: Pull image
        shell: bash
        run: sudo podman pull "ghcr.io/royaloughtness/${{ matrix.image }}:latest"

      - name: Build ISO
        id: iso_build
        uses: osbuild/bootc-image-builder-action@019bb59c5100ecec4e78c9e94e18a840110f7a0b # v0.0.2
        with:
          config-file: ./.github/workflows/config/iso.toml
          image: "ghcr.io/royaloughtness/${{ matrix.image }}:latest"
          rootfs: btrfs          
          types: iso
          additional-args: --use-librepo=True


      - name: Rename ISO and sign CHECKSUM
        id: rename
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.iso_build.outputs.anaconda-iso-output-path }}
          OUTPUT_DIRECTORY: ${{ steps.iso_build.outputs.output-directory }}
          CHECKSUM: ${{ steps.iso_build.outputs.anaconda-iso-output-checksum }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "OUTPUT PATH"
          echo $OUTPUT_PATH
          echo "OUTPUT_DIRECTORY"
          echo $OUTPUT_DIRECTORY
          echo "CHECKSUM"
          echo $CHECKSUM

          sudo chown $(whoami) $OUTPUT_PATH $OUTPUT_DIRECTORY
          
          TARGET_OUTPUT_PATH="$OUTPUT_DIRECTORY/$IMAGE_NAME.iso"
          TARGET_CHECKSUM_PATH="$OUTPUT_DIRECTORY/$IMAGE_NAME.iso-CHECKSUM"

          mv $OUTPUT_PATH $TARGET_OUTPUT_PATH
          echo "$CHECKSUM" > "$TARGET_CHECKSUM_PATH"

          HASH=$(cat $TARGET_CHECKSUM_PATH)
          ISO_SIZE=$(stat -c %s $TARGET_OUTPUT_PATH)
          ISO_FILE_NAME="${IMAGE_NAME}.iso"
          {
            echo "# $ISO_FILE_NAME: $ISO_SIZE bytes"
            echo "SHA256 ($ISO_FILE_NAME) = $HASH"
          } > "$TARGET_CHECKSUM_PATH"


          echo "CHECKSUM contents"
          cat $TARGET_CHECKSUM_PATH
          echo

          echo "${{ secrets.ISO_SIGNING_KEY }}" | gpg --import

          cd $OUTPUT_DIRECTORY

          echo "Signing the ISO"
          gpg --clearsign -u 26B4463ED8F313BC7E3FBDF9D9223AF0F47B3E41 "${IMAGE_NAME}.iso-CHECKSUM"
          mv "${IMAGE_NAME}.iso-CHECKSUM.asc" "${IMAGE_NAME}.iso-CHECKSUM"

          echo "Signed CHECKSUM contents"
          cat "${IMAGE_NAME}.iso-CHECKSUM"
          echo

          # validate signature
          curl -O "https://repo.secureblue.dev/secureblue.gpg"
          gpg --no-default-keyring --keyring ./secureblue-keyring.gpg --import secureblue.gpg

          if ! gpgv --keyring ./secureblue-keyring.gpg "${IMAGE_NAME}.iso-CHECKSUM"; then
              echo "CHECKSUM signature verification FAILED! Exiting..."
              exit 1
          fi

          if ! sha256sum --ignore-missing -c "${IMAGE_NAME}.iso-CHECKSUM"; then
              echo "CHECKSUM verification FAILED! Exiting..."
              exit 1
          fi

          rm ./secureblue-keyring.gpg~
          rm secureblue.gpg
          
          cd -

      - name: Upload ISO and Checksum to Job Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ${{ steps.iso_build.outputs.output-directory }}
          name: ${{ matrix.image }}
          if-no-files-found: error
          retention-days: 20
          compression-level: 0
          overwrite: true

      - name: Upload ISO and checksum to R2 to ISOS Bucket
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.ISOS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.ISOS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.ISOS_ENDPOINT }}
          SOURCE_DIR: .
        run: |
          rclone copy "${{ steps.iso_build.outputs.output-directory }}" R2:isos 
      
