name: Automod

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  comment-filter:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
    - name: Comment filter
      uses: DecimalTurn/Comment-Filter@9c95bdb06ae1dd6b8185d58f52a07a2a71e19d94 # v0.2.2
      with:
        exclude-contributors: true